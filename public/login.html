<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tabkennel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dfe3e8; --text:#1c2128; --dim:#66707c; --acc:#2f6fe4; --bad:#c9372c; color-scheme:light }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1014; --card:#151a20; --line:#262d36; --text:#e3e8ee; --dim:#8a95a3; --acc:#6ea8ff; --bad:#ff7b72; color-scheme:dark } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px }
  h1 { margin:0 0 4px; font-size:20px; display:flex; align-items:center; gap:10px }
  p { margin:0 0 20px; color:var(--dim); font-size:14px }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit }
  input:focus { outline:2px solid var(--acc); outline-offset:1px }
  button { margin-top:12px; width:100%; padding:11px; border:0; border-radius:9px; background:var(--acc); color:#fff; font:600 15px system-ui,sans-serif; cursor:pointer }
  .err { color:var(--bad); font-size:13px; margin:10px 0 0; display:none }
  .wrong .err { display:block }
</style>
</head>
<body>
<form method="post" action="/login" id="f">
  <h1><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>tabkennel</h1>
  <p>Sign in to the shared browser.</p>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required aria-label="Password">
  <div class="err">That password didn't work. Try again.</div>
  <button>Sign in</button>
</form>
<script>if (location.search.includes('wrong')) document.getElementById('f').className = 'wrong';</script>
</body>
</html>
