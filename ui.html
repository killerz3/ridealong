<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-browser</title>
<style>
  :root { --bg:#0b0d10; --panel:#12151a; --line:#232830; --text:#d8dde5; --dim:#7d8794; --acc:#7cc4ff; }
  * { box-sizing:border-box }
  body { margin:0; height:100vh; display:grid; grid-template-columns:260px 1fr; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,sans-serif; overflow:hidden }
  aside { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0 }
  aside header { padding:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line) }
  aside header b { font-weight:600; letter-spacing:.02em }
  #tabs { overflow:auto; padding:6px 0; flex:1 }
  .group { padding:10px 14px 4px; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; display:flex; gap:6px; align-items:center }
  .dot { width:7px; height:7px; border-radius:50% }
  .tab { padding:7px 14px 7px 22px; cursor:pointer; display:flex; gap:6px; align-items:center }
  .tab:hover { background:#1a1e25 }
  .tab.on { background:#1c2633; box-shadow:inset 2px 0 var(--acc) }
  .tab span { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis }
  .tab i { font-style:normal; color:var(--dim); visibility:hidden; padding:0 4px }
  .tab:hover i { visibility:visible } .tab i:hover { color:#ff8a8a }
  main { display:flex; flex-direction:column; min-width:0; min-height:0 }
  nav { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line); background:var(--panel) }
  button { background:#1a1e25; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer }
  button:hover { border-color:#3a4250 }
  #url { flex:1; background:#0e1115; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit }
  #stage { flex:1; display:grid; place-items:center; min-height:0; position:relative; outline:none }
  #screen { max-width:100%; max-height:100%; cursor:default; user-select:none; -webkit-user-drag:none }
  #empty { color:var(--dim); position:absolute }
  #stage:focus-within #screen, #stage:focus #screen { box-shadow:0 0 0 1px #2c4a66 }
  @media (max-width:700px) { body { grid-template-columns:1fr } aside { display:none } }
</style>
</head>
<body>
<aside>
  <header><b>agent-browser</b><button id="new" title="new tab">+ tab</button></header>
  <div id="tabs"></div>
</aside>
<main>
  <nav>
    <button id="back">←</button><button id="fwd">→</button><button id="reload">↻</button>
    <input id="url" placeholder="url or search" spellcheck="false">
  </nav>
  <div id="stage" tabindex="0"><div id="empty">pick a tab</div><img id="screen" alt=""></div>
</main>
<script>
const $ = s => document.querySelector(s);
const screen = $('#screen'), stage = $('#stage'), url = $('#url');
let ws, meta = null, current = null, lastTabs = '';
const COLORS = ['#7cc4ff', '#ffb86b', '#9be29b', '#e6a3ff', '#ff8fa3', '#f5e07a'];
const color = name => name ? COLORS[[...name].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length] : '#8a94a3';
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => current && send({ t: 'view', id: current });
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'frame') { meta = m.meta; screen.src = 'data:image/jpeg;base64,' + m.data; $('#empty').style.display = 'none'; }
    else if (m.t === 'url') { if (document.activeElement !== url) url.value = m.url; }
    else if (m.t === 'tabs') renderTabs(m.tabs);
    else if (m.t === 'clip') navigator.clipboard && navigator.clipboard.writeText(m.text).catch(() => {});
    else if (m.t === 'error') $('#empty').textContent = m.msg;
  };
}

function renderTabs(tabs) {
  const key = JSON.stringify(tabs) + current;
  if (key === lastTabs) return; lastTabs = key;
  if (current && !tabs.some(t => t.id === current)) { current = null; screen.removeAttribute('src'); $('#empty').style.display = ''; }
  const groups = {};
  for (const t of tabs) (groups[t.owner || ''] ||= []).push(t);
  const names = Object.keys(groups).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));
  const el = $('#tabs'); el.innerHTML = '';
  for (const n of names) {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="dot" style="background:${color(n)}"></span>`;
    g.append(n ? 'bot · ' + n : 'you');
    el.append(g);
    for (const t of groups[n]) {
      const d = document.createElement('div'); d.className = 'tab' + (t.id === current ? ' on' : '');
      const s = document.createElement('span'); s.textContent = t.title || t.url; s.title = t.url;
      const x = document.createElement('i'); x.textContent = '×'; x.title = 'close tab';
      x.onclick = e => { e.stopPropagation(); send({ t: 'close', id: t.id }); };
      d.append(s, x); d.onclick = () => view(t.id);
      el.append(d);
    }
  }
}
function view(id) { current = id; lastTabs = ''; send({ t: 'view', id }); stage.focus(); }

$('#new').onclick = () => send({ t: 'new' });
$('#back').onclick = () => send({ t: 'back' });
$('#fwd').onclick = () => send({ t: 'fwd' });
$('#reload').onclick = () => send({ t: 'reload' });
url.onkeydown = e => { if (e.key === 'Enter') { send({ t: 'nav', url: url.value }); stage.focus(); } };

// map a pointer event on the scaled screenshot to page CSS pixels
const pos = e => {
  const r = screen.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * meta.deviceWidth, y: (e.clientY - r.top) / r.height * meta.deviceHeight };
};
const mods = e => ({ alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, shift: e.shiftKey });
const BTN = ['left', 'middle', 'right'];
let clicks = 0, lastDown = 0;
screen.addEventListener('mousedown', e => {
  if (!meta) return; e.preventDefault(); stage.focus();
  clicks = Date.now() - lastDown < 400 ? clicks + 1 : 1; lastDown = Date.now();
  send({ t: 'mouse', type: 'mousePressed', ...pos(e), button: BTN[e.button], buttons: e.buttons, clickCount: clicks, ...mods(e) });
});
screen.addEventListener('mouseup', e => meta && send({ t: 'mouse', type: 'mouseReleased', ...pos(e), button: BTN[e.button], buttons: e.buttons, clickCount: clicks, ...mods(e) }));
let moveQueued = null;
screen.addEventListener('mousemove', e => {
  if (!meta) return;
  const m = { t: 'mouse', type: 'mouseMoved', ...pos(e), button: e.buttons & 1 ? 'left' : 'none', buttons: e.buttons, ...mods(e) };
  if (!moveQueued) requestAnimationFrame(() => { send(moveQueued); moveQueued = null; });
  moveQueued = m;
});
screen.addEventListener('wheel', e => { if (!meta) return; e.preventDefault(); send({ t: 'mouse', type: 'mouseWheel', ...pos(e), dx: e.deltaX, dy: e.deltaY, ...mods(e) }); }, { passive: false });
screen.addEventListener('contextmenu', e => e.preventDefault());

stage.addEventListener('keydown', e => {
  if (!current) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') return; // handled by paste
  e.preventDefault();
  send({ t: 'key', type: 'keyDown', key: e.key, code: e.code, keyCode: e.keyCode, ...mods(e) });
});
stage.addEventListener('keyup', e => { if (!current) return; e.preventDefault(); send({ t: 'key', type: 'keyUp', key: e.key, code: e.code, keyCode: e.keyCode, ...mods(e) }); });
document.addEventListener('paste', e => { if (e.target === url) return; const text = e.clipboardData.getData('text'); if (text) send({ t: 'text', text }); });

connect();
</script>
</body>
</html>
